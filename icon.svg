<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"></stop>
      <stop offset="1" stop-color="#111827"></stop>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444"></stop>
      <stop offset="1" stop-color="#b91c1c"></stop>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"></stop>
      <stop offset="1" stop-color="#2563eb"></stop>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".35"></feDropShadow>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="105" fill="url(#bg)" filter="url(#shadow)"></rect>

  <!-- Red LEGO brick -->
  <g transform="translate(92 155)">
    <rect x="0" y="55" width="180" height="125" rx="18" fill="url(#red)"></rect>

    <rect x="22" y="28" width="54" height="42" rx="12" fill="#dc2626"></rect>
    <rect x="104" y="28" width="54" height="42" rx="12" fill="#dc2626"></rect>

    <ellipse cx="49" cy="29" rx="19" ry="8" fill="#f87171" opacity=".7"></ellipse>
    <ellipse cx="131" cy="29" rx="19" ry="8" fill="#f87171" opacity=".7"></ellipse>

    <rect x="18" y="75" width="144" height="12" rx="6" fill="#991b1b" opacity=".45"></rect>
  </g>

  <!-- Blue LEGO brick -->
  <g transform="translate(240 238)">
    <rect x="0" y="55" width="180" height="125" rx="18" fill="url(#blue)"></rect>

    <rect x="22" y="28" width="54" height="42" rx="12" fill="#2563eb"></rect>
    <rect x="104" y="28" width="54" height="42" rx="12" fill="#2563eb"></rect>

    <ellipse cx="49" cy="29" rx="19" ry="8" fill="#60a5fa" opacity=".7"></ellipse>
    <ellipse cx="131" cy="29" rx="19" ry="8" fill="#60a5fa" opacity=".7"></ellipse>

    <rect x="18" y="75" width="144" height="12" rx="6" fill="#1e40af" opacity=".45"></rect>
  </g>

  <!-- Sync arrows -->
  <g fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="round" stroke-linejoin="round">

    <!-- upper/right arrow -->
    <path d="M275 105
             C340 78 408 105 430 160"></path>
    <path d="M398 135 L432 162 L399 183"></path>

    <!-- lower/left arrow -->
    <path d="M237 407
             C172 434 104 407 82 352"></path>
    <path d="M114 377 L80 350 L113 329"></path>
  </g>

  <!-- Small center sync symbol -->
  <circle cx="256" cy="256" r="37" fill="#111827" stroke="#ffffff" stroke-width="8"></circle>

  <path d="M239 253
           C243 238 260 232 273 241" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"></path>

  <path d="M271 241 L274 253 L262 251" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>

  <path d="M273 259
           C269 274 252 280 239 271" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"></path>

  <path d="M241 271 L238 259 L250 261" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
